[package]
name = "conductor-core"
version.workspace = true
description = "What remote-control-conductor-server and its clients share: reading Claude Code's transcripts, the account and running-session registry, the API, pairing, and certificate pinning."
license.workspace = true
edition.workspace = true
publish = false

[lib]
name = "conductor_core"

[features]
# Pinning an remote-control-conductor-server certificate (rustls). Off for code that only
# reads Claude Code's files.
tls = ["dep:rustls", "dep:subtle"]

[dependencies]
base64 = "0.22"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
subtle = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
